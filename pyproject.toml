[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cephas-cybershield-ml"
version = "0.3.1"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3", "pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.4,<1", "psycopg-pool>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
