name: Temporary uv lock refresh
on:
  push:
    branches: ["milestone/cybershield-0.3.3-cryptographic-model-signing"]
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-lock.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/cybershield-0.3.3-cryptographic-model-signing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - name: Regenerate lock
        run: uv lock --python 3.11
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git commit -m "chore: refresh complete uv lock"
          git push origin HEAD:milestone/cybershield-0.3.3-cryptographic-model-signing
