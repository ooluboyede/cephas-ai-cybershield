name: Generate dependency lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybershield-dependency-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: false
      - name: Resolve and lock dependencies
        run: uv lock --python 3.11
      - name: Verify locked installation
        run: uv sync --locked --all-extras --python 3.11
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Add hash-verified dependency lock"
          git push origin HEAD:${{ github.ref_name }}
