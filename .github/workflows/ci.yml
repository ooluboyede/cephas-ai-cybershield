name: CyberShield ML CI
on:
  push:
    branches: [main, "feature/**", "milestone/**", "foundation/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: cybershield
          POSTGRES_PASSWORD: cybershield_test_only
          POSTGRES_DB: cybershield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cybershield -d cybershield_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CYBERSHIELD_TEST_DATABASE_URL: postgresql://cybershield:cybershield_test_only@localhost:5432/cybershield_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check --python 3.11
      - name: Install exact locked dependencies
        run: uv sync --locked --all-extras --python 3.11
      - name: Ruff
        run: uv run --locked ruff check src tests scripts services
      - name: Unit and PostgreSQL integration tests
        run: uv run --locked pytest -q
