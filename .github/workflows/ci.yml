name: CyberShield ML CI
on:
  push:
    branches: [main, "feature/**", "milestone/**", "foundation/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" "psycopg[binary]>=3.1,<4"
      - run: python scripts/provision_dirmc_ci_postgres.py
        env:
          CEPHAS_DIRMC_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          CEPHAS_DIRMC_TEST_PASSWORD: ci-only-dirmc-password
          CEPHAS_DIRMC_TEST_TENANT: dirmc-ci-tenant
      - run: python scripts/provision_dirmc_ci_matrix.py
        env:
          CEPHAS_DIRMC_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          CEPHAS_DIRMC_MATRIX_PASSWORD: ci-only-matrix-password
      - run: python scripts/validate_dirmc_backup_restore.py
        env:
          CEPHAS_DIRMC_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          CEPHAS_DIRMC_TEST_DSN: postgresql://dirmc_ci_runtime:ci-only-dirmc-password@localhost:5432/postgres
          CEPHAS_DIRMC_TEST_TENANT: dirmc-ci-tenant
      - run: python scripts/validate_dirmc_multi_principal.py
        env:
          CEPHAS_DIRMC_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          CEPHAS_DIRMC_MATRIX_PASSWORD: ci-only-matrix-password
      - run: ruff check src tests scripts
      - run: pytest -q
        env:
          CEPHAS_DIRMC_TEST_DSN: postgresql://dirmc_ci_runtime:ci-only-dirmc-password@localhost:5432/postgres
          CEPHAS_DIRMC_TEST_TENANT: dirmc-ci-tenant
