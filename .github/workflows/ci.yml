name: CyberShield ML CI
on:
  push:
    branches: [main, "feature/**", "milestone/**", "foundation/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check --python 3.11
      - name: Install exact locked dependencies
        run: uv sync --locked --all-extras --python 3.11
      - name: Ruff
        run: uv run --locked ruff check src tests scripts
      - name: Tests
        run: uv run --locked pytest -q
